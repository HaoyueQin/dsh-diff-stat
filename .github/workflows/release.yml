# A pushed version tag IS the release: verify the tagged tree, then open the
# GitHub Release with generated notes and the pack tarballs. The npm publish
# stays a separate manual step (it requires the owner's 2FA OTP).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json only
      # (a "version" input alongside packageManager is a hard error in
      # pnpm/action-setup).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:align
      - run: pnpm build
      - run: git diff --exit-code -- lib/
      - name: Pack tarball
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          # Versioned asset plus a fixed-name copy: the marketplace tarball:
          # field points at releases/latest/download/<fixed>.tgz, which must
          # keep resolving to the newest build across versions. Select the
          # versioned file by name shape (not by unsorted directory order).
          TARBALL="dist/$(ls dist | grep -E '^dsh-diff-stat-[0-9].*\.tgz$' | head -1)"
          if [ -z "$TARBALL" ]; then echo "versioned tarball not found"; exit 1; fi
          cp "$TARBALL" dist/dsh-diff-stat.tgz
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "FIXED_TARBALL=dist/dsh-diff-stat.tgz" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "$TARBALL" "$FIXED_TARBALL"
