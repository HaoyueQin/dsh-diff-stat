name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DSH_CHECKOUT: ${{ github.workspace }}/dsh
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout deepseek-harness (plugin build-time dependency source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # Pinned to the same rc.2-era commit the plugin targets.
          ref: b150a551b8
          path: dsh
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match the checked-out harness packageManager (no root manifest).
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml

      - name: Build harness (tsc emits lib runtimes)
        working-directory: dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Install plugin
        working-directory: plugin
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build plugin (host half + client bundle)
        working-directory: plugin
        run: |
          bash scripts/build.sh
          npm run build:client

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Diff alignment checks
        working-directory: plugin
        run: npm run check:align

      - name: Verify committed lib matches the fresh build
        working-directory: plugin
        run: |
          if ! git diff --exit-code -- lib/; then
            echo "::error::lib/ differs from the fresh build — rebuild and commit lib/ together with source changes"
            exit 1
          fi

      - name: Pack tarball
        working-directory: plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          echo "TARBALL=$(ls dist/*.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: plugin
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "$TARBALL"
