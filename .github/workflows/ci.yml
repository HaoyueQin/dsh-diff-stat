name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the packageManager field in package.json only
      # (a "version" input alongside packageManager is a hard error in
      # pnpm/action-setup).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Native TS type stripping needs Node >= 23.6 (backported to 22.18);
      # pinned to 24, the line the check was verified on.
      - run: pnpm check:align
      - run: pnpm build
      # lib/ is committed so github: repo-url installs work without build
      # rights; a source change without a rebuilt lib would ship stale
      # artifacts. All bundled modules resolve inside the project with
      # lockfile-pinned versions, so the build is byte-stable across machines
      # and this diff must be empty.
      - run: git diff --exit-code -- lib/
