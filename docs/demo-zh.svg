    <radialGradient id="blobBlue"><stop offset="0" stop-color="#dbe7fb" stop-opacity=".85"/><stop offset="1" stop-color="#dbe7fb" stop-opacity="0"/></radialGradient>
    <filter id="panelSh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8fa0c0" flood-opacity=".4"/>
    </filter>
    <clipPath id="diffClip"><rect x="44" y="84" width="632" height="0">
